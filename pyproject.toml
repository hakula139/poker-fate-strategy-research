[project]
name = "poker-fate-strategy-research"
version = "0.1.0"
description = "Poker Fate research tools"
requires-python = ">=3.13"
dependencies = ["protobuf>=7.36.2", "UnityPy>=1.25.4", "websockets>=17.2", "xxtea>=6.2.0"]

[project.optional-dependencies]
android = ["frida==17.23.3"]

[project.scripts]
poker-fate-strategy = "poker_fate_strategy_research.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_fate_strategy_research"]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-cov>=7.1.0", "types-protobuf>=7.35.1.20260906"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.mypy]
files = ["src", "tests"]
exclude_gitignore = true
strict = true

[[tool.mypy.overrides]]
module = ["UnityPy.*", "mitmproxy.*", "xxtea"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term", "--cov-report=xml"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["poker_fate_strategy_research"]
